<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ragdoll Stickman - Crown Battle Release</title>
<style>
    html, body { margin:0; height:100%; overflow:hidden; background:#0f172a; color:#f8fafc; font-family: system-ui, sans-serif; user-select:none; }
    #gameCanvas { display:block; background:linear-gradient(#1e293b,#0f172a); }
    #ui { position:absolute; top:12px; left:12px; font-size:15px; color:#e2e8f0; line-height:1.6; text-shadow: 1px 1px 2px #000; }
    #ui h1 { margin:0 0 4px; font-size:24px; color:#fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
    #ui b { color:#38bdf8; }
    #ui .p2 { color:#fb923c; }
</style>
</head>
<body>
<div id="ui">
    <h1>👑 RACE TO THE CROWN</h1>
    <div><b>P1</b>: ← → Jalan, ↑ Lompat, ↓ Pukul &nbsp;|&nbsp; <b class="p2">P2</b>: A D Jalan, W Lompat, S Pukul</div>
    <div>Siapa yang mencapai Mahkota Emas lebih dulu, dia menang!</div>
</div>
<canvas id="gameCanvas"></canvas>

<script>
// ==========================================================
//  VARIABEL STATIS (V7-Public Stable)
// ==========================================================
const RAGDOLL_STRENGTH = 0.3;
const jumpPower = 19.5;
const GRAVITY = 0.95;
const walkingSpeed = 5.5;
const motionValue = 0.8;
const motionDefense = 3;
const platformWidth = 150;

const MIN_STAND_STRENGTH = 0.25;
const ALLOW_HOLD_JUMP = false;
const MAX_SPEED = 30;

const PUNCH_FRAMES = 14;
const FIST_R = 7;
const HIT_PUSH = 8;
const LAUNCH_X = 20, LAUNCH_Y = 22;
const THROWN_MIN = 25, THROWN_MAX = 150;
const INVULN_AFTER = 30;
const GETUP_MAX = 6;

const FLOOR_HEIGHT = 60;
const AIR_DRAG = 0.995;

const HEAD_R = 12, FOOT_R = 4, JOINT_R = 4;
const HEAD_DIST = 22, TORSO = 42;
const UPPER_LEG = 28, LOWER_LEG = 28, LEG_LEN = UPPER_LEG + LOWER_LEG;
const UPPER_ARM = 20, LOWER_ARM = 20;
const STANCE = 9;
const STRIDE = 16, STEP_HEIGHT = 9;

// ==========================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height, groundY;
let platforms = [];
let effects = [];
let crown = { x: 0, y: 0, active: false };
let gameOver = false;
let winnerName = "";
let winnerColor = "";

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

class Point {
    constructor(x, y, r) {
        this.x = this.oldX = x; this.y = this.oldY = y; this.prevY = y;
        this.r = r; this.pinX = false; this.pinY = false; this.isFoot = false;
    }
    update(g) {
        this.prevY = this.y;
        const vx = clamp((this.x - this.oldX) * AIR_DRAG, -MAX_SPEED, MAX_SPEED);
        const vy = clamp((this.y - this.oldY) * AIR_DRAG, -MAX_SPEED, MAX_SPEED);
        this.oldX = this.x; this.oldY = this.y;
        this.x += vx;
        this.y += vy + g;
    }
    land(surfaceY) {
        this.y = surfaceY - this.r;
        const vx = (this.x - this.oldX) * 0.6;
        this.oldY = this.y + (this.y - this.oldY) * 0.05;
        this.oldX = this.x - vx;
    }
    bounds() {
        if (this.y > groundY - this.r) this.land(groundY);
        if (this.x > width - this.r)  { this.x = width - this.r;  this.oldX = this.x; }
        if (this.x < this.r)          { this.x = this.r;          this.oldX = this.x; }
    }
}

class Bone {
    constructor(a, b, len) { this.a = a; this.b = b; this.len = len; }
    resolve() {
        const a = this.a, b = this.b;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.0001;
        const f = (this.len - d) / d;
        const ax = a.pinX ? 0 : 1, bx = b.pinX ? 0 : 1, sx = ax + bx;
        const ay = a.pinY ? 0 : 1, by = b.pinY ? 0 : 1, sy = ay + by;
        if (sx > 0) { a.x -= dx * f * ax / sx; b.x += dx * f * bx / sx; }
        if (sy > 0) { a.y -= dy * f * ay / sy; b.y += dy * f * by / sy; }
    }
}

class Platform {
    constructor(x, y, w, h) { this.x = x; this.y = y; this.w = w; this.h = h; this.isGold = false; }
    collide(p) {
        if (p.x < this.x || p.x > this.x + this.w) return;
        const prevBottom = p.prevY + p.r, bottom = p.y + p.r;
        if (prevBottom <= this.y + 2 && bottom > this.y) p.land(this.y);
    }
}

function surfaceFor(x, bottom) {
    let best = groundY;
    for (const pl of platforms)
        if (x >= pl.x && x <= pl.x + pl.w && pl.y >= bottom - 6 && pl.y < best) best = pl.y;
    return best;
}

function pull(p, tx, ty, k, damp) {
    const dx = (tx - p.x) * k, dy = (ty - p.y) * k;
    p.x += dx; p.y += dy;
    p.oldX += dx * damp; p.oldY += dy * damp;
}

// ==========================================================
//  RAGDOLL SYSTEM
// ==========================================================
class Ragdoll {
    constructor(name, color, jointColor, binds) {
        this.name = name; this.color = color; this.jointColor = jointColor;
        this.binds = binds;
        this.input = { left: false, right: false, jump: false, punch: false };
    }

    get motionValue()   { return motionValue; }
    get motionDefense() { return motionDefense; }
    maxDefense() { return Math.max(0, Math.round(this.motionDefense)); }

    build(cx) {
        this.points = []; this.bones = [];
        const P = (x, y, r) => { const p = new Point(x, y, r); this.points.push(p); return p; };
        const B = (a, b, l) => this.bones.push(new Bone(a, b, l));
        const py = groundY - FOOT_R - LEG_LEN * 0.95;
        const j = this.j = {};
        j.pelvis = P(cx, py, JOINT_R);
        j.neck   = P(cx, py - TORSO, JOINT_R);
        j.head   = P(cx, py - TORSO - HEAD_DIST, HEAD_R);
        j.elbowL = P(cx - 7, j.neck.y + UPPER_ARM, JOINT_R);
        j.handL  = P(cx - 9, j.neck.y + UPPER_ARM + LOWER_ARM, JOINT_R);
        j.elbowR = P(cx + 7, j.neck.y + UPPER_ARM, JOINT_R);
        j.handR  = P(cx + 9, j.neck.y + UPPER_ARM + LOWER_ARM, JOINT_R);
        j.kneeL  = P(cx - 5, py + UPPER_LEG, JOINT_R);
        j.footL  = P(cx - STANCE, groundY - FOOT_R, FOOT_R);
        j.kneeR  = P(cx + 5, py + UPPER_LEG, JOINT_R);
        j.footR  = P(cx + STANCE, groundY - FOOT_R, FOOT_R);
        B(j.neck, j.head, HEAD_DIST);
        B(j.pelvis, j.neck, TORSO);
        B(j.neck, j.elbowL, UPPER_ARM);   B(j.elbowL, j.handL, LOWER_ARM);
        B(j.neck, j.elbowR, UPPER_ARM);   B(j.elbowR, j.handR, LOWER_ARM);
        B(j.pelvis, j.kneeL, UPPER_LEG);  B(j.kneeL, j.footL, LOWER_LEG);
        B(j.pelvis, j.kneeR, UPPER_LEG);  B(j.kneeR, j.footR, LOWER_LEG);
        j.footL.isFoot = true; j.footR.isFoot = true;
        this.setRootPinned(true);
        this.state = 'normal'; this.thrownT = 0; this.invuln = 0; this.hitFlash = 0;
        this.punchT = 0; this.punchCd = 0; this.prevPunch = false; this.punchHit = false;
        this.defenseCurrent = this.lastMaxDef = this.maxDefense();
        this.facing = 1; this.stepPhase = 0; this.jumpCooldown = 0;
        this.jumpBuf = 0; this.prevJump = false; this.supported = false;
    }

    setRootPinned(v) { this.j.pelvis.pinX = v; this.j.pelvis.pinY = v; }

    controller() {
        const { pelvis, neck, head, elbowL, handL, elbowR, handR, kneeL, footL, kneeR, footR } = this.j;
        const s = MIN_STAND_STRENGTH + (1 - MIN_STAND_STRENGTH) * RAGDOLL_STRENGTH;

        const kTorso = 0.05 + 0.30 * s, kHead = 0.04 + 0.25 * s, kArm = 0.02 + 0.18 * s;
        const kKnee = 0.20 + 0.20 * s, kFoot = 0.35 + 0.15 * s, supportK = 0.25 + 0.25 * s;
        const heightRatio = 0.80 + 0.17 * s;
        const slouch = (1 - s) * 8;
        const stride = clamp(STRIDE * walkingSpeed / 2.6, 10, 34);

        const inp = this.input;
        if (this.jumpCooldown > 0) this.jumpCooldown--;
        if (this.invuln > 0) this.invuln--;
        if (this.hitFlash > 0) this.hitFlash--;

        const md = this.maxDefense();
        this.defenseCurrent = clamp(this.defenseCurrent + (md - this.lastMaxDef), 0, md);
        this.lastMaxDef = md;

        const feet = [footL, footR], knees = [kneeL, kneeR];
        const surf = feet.map(f => surfaceFor(f.x, f.y + FOOT_R));
        const grd  = feet.map((f, i) => f.y >= surf[i] - FOOT_R - 4);

        if (this.state === 'thrown') {
            this.thrownT++;
            this.supported = false;
            this.prevJump = inp.jump; this.prevPunch = inp.punch;
            const onGround = grd[0] || grd[1] || pelvis.y >= groundY - pelvis.r - 3;
            const slow = Math.abs(pelvis.y - pelvis.oldY) < 2 && Math.abs(pelvis.x - pelvis.oldX) < 2;
            if ((this.thrownT >= THROWN_MIN && onGround && slow) || this.thrownT >= THROWN_MAX) {
                this.state = 'normal';
                this.setRootPinned(true);
                pelvis.oldX = pelvis.x; pelvis.oldY = pelvis.y;
                this.invuln = INVULN_AFTER;
            } else return;
        }

        const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
        if (dir && this.punchT === 0) this.facing = dir;
        const facing = this.facing;

        const punchEdge = inp.punch && !this.prevPunch;
        this.prevPunch = inp.punch;
        if (this.punchCd > 0) this.punchCd--;
        if (punchEdge && this.punchT === 0 && this.punchCd === 0) { this.punchT = 1; this.punchHit = false; }
        else if (this.punchT > 0) {
            this.punchT++;
            if (this.punchT > PUNCH_FRAMES) { this.punchT = 0; this.punchCd = 6; }
        }
        const ext = this.punchT > 0 ? Math.sin(Math.PI * (this.punchT - 1) / (PUNCH_FRAMES - 1)) : 0;
        const rising = (pelvis.y - pelvis.oldY) < -1.5;
        let supported = (grd[0] || grd[1]) && this.jumpCooldown <= 0 && !rising;

        const edge = inp.jump && !this.prevJump;
        this.prevJump = inp.jump;
        if (edge) this.jumpBuf = 6;
        const wantJump = ALLOW_HOLD_JUMP ? inp.jump : this.jumpBuf > 0;
        if (wantJump && supported) {
            for (const p of this.points) p.oldY = p.y + jumpPower;
            this.jumpCooldown = 6; this.jumpBuf = 0;
            supported = false;
        } else if (this.jumpBuf > 0) this.jumpBuf--;
        this.supported = supported;

        if (supported) {
            let top = Infinity;
            for (let i = 0; i < 2; i++) if (grd[i]) top = Math.min(top, surf[i]);
            const ty = top - FOOT_R - LEG_LEN * heightRatio;
            const dy = Math.max((ty - pelvis.y) * supportK, -GETUP_MAX);
            pelvis.y += dy; pelvis.oldY += dy;
            pelvis.oldY = pelvis.y - (pelvis.y - pelvis.oldY) * 0.5;
        }

        const accel = supported ? 0.08 + 0.17 * s : 0.04;
        if (supported || dir) {
            let vx = pelvis.x - pelvis.oldX;
            vx += (dir * walkingSpeed - vx) * accel;
            pelvis.oldX = pelvis.x - vx;
        }

        const lean = dir * (5 + (1 - s) * 4);
        pull(neck, pelvis.x + facing * slouch + lean + facing * 4 * ext, pelvis.y - TORSO, kTorso, 0.5);
        pull(head, neck.x + facing * slouch * 0.5 + lean * 0.5, neck.y - HEAD_DIST, kHead, 0.5);

        if (dir && supported) this.stepPhase += Math.PI * walkingSpeed / (2 * stride);
        for (let i = 0; i < 2; i++) {
            const foot = feet[i], knee = knees[i], side = i === 0 ? -1 : 1;
            let tx, ty;
            if (supported) {
                let lift = 0;
                if (dir) {
                    const ph = this.stepPhase + i * Math.PI;
                    tx = pelvis.x + dir * stride * Math.cos(ph);
                    lift = Math.max(0, -Math.sin(ph)) * STEP_HEIGHT;
                } else tx = pelvis.x + side * STANCE;
                ty = surfaceFor(tx, foot.y + FOOT_R) - FOOT_R - lift;
            } else {
                tx = pelvis.x + side * 6;
                ty = pelvis.y + LEG_LEN * 0.8;
            }
            pull(foot, tx, ty, kFoot, 0.3);
            pull(knee, (pelvis.x + foot.x) / 2 + facing * 6, (pelvis.y + foot.y) / 2, kKnee, 0.5);
        }

        const arms = [[elbowL, handL], [elbowR, handR]];
        for (let i = 0; i < 2; i++) {
            const side = i === 0 ? -1 : 1, [elbow, hand] = arms[i];
            if (ext > 0 && i === (facing > 0 ? 1 : 0)) {
                pull(elbow, neck.x + facing * (6 + 16 * ext), neck.y + 10, 0.5, 0.2);
                pull(hand,  neck.x + facing * (8 + 32 * ext), neck.y + 12, 0.6, 0.15);
                continue;
            }
            if (supported) {
                const swing = dir ? Math.sin(this.stepPhase + (i === 0 ? Math.PI : 0)) * 10 : 0;
                pull(elbow, neck.x + side * 7 + swing * 0.5, neck.y + 18, kArm, 0.4);
                pull(hand,  neck.x + side * 9 + swing,       neck.y + 36, kArm, 0.35);
            } else {
                pull(elbow, neck.x + side * 14, neck.y + 12, kArm, 0.4);
                pull(hand,  neck.x + side * 22, neck.y + 22, kArm, 0.35);
            }
        }
    }

    checkHit() {
        if (this.state !== 'normal' || this.punchT === 0 || this.punchHit || gameOver) return;
        const ext = Math.sin(Math.PI * (this.punchT - 1) / (PUNCH_FRAMES - 1));
        if (ext < 0.6) return;
        const hand = this.facing > 0 ? this.j.handR : this.j.handL;
        for (const o of chars) {
            if (o === this || o.state !== 'normal' || o.invuln > 0) continue;
            for (const p of o.points) {
                if (Math.hypot(hand.x - p.x, hand.y - p.y) < FIST_R + p.r) {
                    this.punchHit = true;
                    o.receiveHit(this, hand.x, hand.y);
                    return;
                }
            }
        }
    }

    receiveHit(attacker, hx, hy) {
        const mv = attacker.motionValue, dir = attacker.facing;
        this.hitFlash = 8;
        effects.push({ x: hx, y: hy, t: 0 });
        if (this.defenseCurrent > 0) {
            this.defenseCurrent--;
            for (const p of this.points) p.oldX -= dir * mv * HIT_PUSH;
        } else {
            this.state = 'thrown'; this.thrownT = 0; this.punchT = 0; this.punchCd = 0;
            this.setRootPinned(false);
            this.defenseCurrent = this.maxDefense();
            for (const p of this.points) {
                p.oldX = p.x - dir * mv * LAUNCH_X;
                p.oldY = p.y + mv * LAUNCH_Y;
            }
        }
    }

    step() {
        if (gameOver) return; // Freeze Physics if game is over
        for (const p of this.points) p.update(GRAVITY);
        this.controller();
        for (let i = 0; i < 12; i++) {
            for (const b of this.bones) b.resolve();
            for (const p of this.points) {
                p.bounds();
                if (p.isFoot) for (const pl of platforms) pl.collide(p);
            }
        }
        this.checkHit();
    }

    draw() {
        const { head } = this.j;
        const col = this.hitFlash > 0 ? '#ffffff' : this.color;
        ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.lineCap = 'round';
        for (const b of this.bones) {
            ctx.beginPath(); ctx.moveTo(b.a.x, b.a.y); ctx.lineTo(b.b.x, b.b.y); ctx.stroke();
        }
        ctx.fillStyle = this.jointColor;
        for (const p of this.points) {
            if (p === head) continue;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r - 1, 0, Math.PI * 2); ctx.fill();
        }
        ctx.beginPath(); ctx.arc(head.x, head.y, HEAD_R, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a'; ctx.fill();
        ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.stroke();
        ctx.fillStyle = this.jointColor;
        ctx.beginPath(); ctx.arc(head.x + this.facing * 5, head.y - 2, 2, 0, Math.PI * 2); ctx.fill();
        
        const md = Math.min(this.maxDefense(), 10), w = 8;
        for (let i = 0; i < md; i++) {
            ctx.beginPath(); ctx.arc(head.x + (i - (md - 1) / 2) * w, head.y - HEAD_R - 12, 2.5, 0, Math.PI * 2);
            if (i < this.defenseCurrent) { ctx.fillStyle = this.color; ctx.fill(); }
            else { ctx.strokeStyle = this.color; ctx.lineWidth = 1; ctx.stroke(); }
        }
    }
}

const p1 = new Ragdoll('P1', '#38bdf8', '#e0f2fe', { left: 'ArrowLeft', right: 'ArrowRight', jump: 'ArrowUp', punch: 'ArrowDown' });
const p2 = new Ragdoll('P2', '#fb923c', '#ffedd5', { left: 'KeyA', right: 'KeyD', jump: 'KeyW', punch: 'KeyS' });
const chars = [p1, p2];

function randomizeColors() {
    const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#eab308'];
    let c1 = colors[Math.floor(Math.random() * colors.length)];
    let c2;
    do { c2 = colors[Math.floor(Math.random() * colors.length)]; } while (c1 === c2);
    
    p1.color = c1;
    p2.color = c2;
    p1.jointColor = '#ffffff';
    p2.jointColor = '#ffffff';

    // Update UI color hints
    document.querySelector('#ui b').style.color = c1;
    document.querySelector('#ui .p2').style.color = c2;
}

function resetChars() {
    p1.build(width * 0.35);
    p2.build(width * 0.65);
}

// ==========================================================
//  PLATFORM GENERATION (Random & Golden Crown)
// ==========================================================
function generateRandomPlatforms() {
    platforms = [];
    let currentX = width * 0.5 - platformWidth / 2;
    let currentY = groundY - 100;
    let dir = Math.random() > 0.5 ? 1 : -1;

    let numPlats = 5 + Math.floor(Math.random() * 4); // 5 to 8 levels

    for (let i = 0; i < numPlats; i++) {
        platforms.push(new Platform(currentX, currentY, platformWidth, 12));

        // Jarak vertikal bisa dicapai dengan jumpPower 19.5 (max est ~200px)
        let jumpY = 90 + Math.random() * 50; 
        currentY -= jumpY;

        let moveX = (100 + Math.random() * 80) * dir;
        currentX += moveX;

        // Bounce from walls
        if (currentX < 40) {
            currentX = 40 + Math.random() * 50;
            dir = 1;
        } else if (currentX > width - platformWidth - 40) {
            currentX = width - platformWidth - 40 - Math.random() * 50;
            dir = -1;
        }
    }

    // Platform Tertinggi (Golden)
    let goldPlat = new Platform(currentX, currentY, platformWidth, 12);
    goldPlat.isGold = true;
    platforms.push(goldPlat);

    crown.x = currentX + platformWidth / 2;
    crown.y = currentY - 30;
    crown.active = true;
}

// ==========================================================
//  GAME LOGIC
// ==========================================================
function checkWinCondition() {
    if (gameOver || !crown.active) return;
    for (const c of chars) {
        let distH = Math.hypot(c.j.head.x - crown.x, c.j.head.y - crown.y);
        let distP = Math.hypot(c.j.pelvis.x - crown.x, c.j.pelvis.y - crown.y);
        if (distH < 35 || distP < 35) {
            crown.active = false;
            gameOver = true;
            winnerName = c.name;
            winnerColor = c.color;
            setTimeout(restartGame, 3500); // Tahan Splash Screen 3.5 Detik
            break;
        }
    }
}

function restartGame() {
    gameOver = false;
    randomizeColors();
    generateRandomPlatforms();
    resetChars();
}

function step() {
    for (const c of chars) c.step();
    for (const f of effects) f.t++;
    effects = effects.filter(f => f.t < 14);
    checkWinCondition();
}

function draw() {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#334155'; ctx.fillRect(0, groundY, width, height - groundY);
    ctx.fillStyle = '#475569'; ctx.fillRect(0, groundY, width, 3);
    
    // Draw Platforms
    for (const pl of platforms) {
        if (pl.isGold) {
            ctx.shadowColor = "rgba(251, 191, 36, 0.8)";
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
            ctx.fillStyle = '#fef08a'; ctx.fillRect(pl.x, pl.y, pl.w, 3);
            ctx.shadowBlur = 0;
        } else {
            ctx.fillStyle = '#4d5f4f'; ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
            ctx.fillStyle = '#6b8f71'; ctx.fillRect(pl.x, pl.y, pl.w, 3);
        }
    }
    
    // Draw Crown
    if (crown.active) {
        let floatY = Math.sin(Date.now() / 250) * 8;
        ctx.shadowColor = "#fbbf24";
        ctx.shadowBlur = 15;
        ctx.font = "32px Arial";
        ctx.textAlign = "center";
        ctx.fillText("👑", crown.x, crown.y + floatY);
        ctx.shadowBlur = 0;
    }

    for (const c of chars) c.draw();
    for (const f of effects) {
        ctx.strokeStyle = `rgba(255,255,255,${1 - f.t / 14})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(f.x, f.y, 4 + f.t * 2, 0, Math.PI * 2); ctx.stroke();
    }

    // Splash Screen Win Override
    if (gameOver) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.fillRect(0, 0, width, height);
        
        ctx.fillStyle = winnerColor;
        ctx.font = "bold 80px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.shadowColor = "#000";
        ctx.shadowBlur = 10;
        ctx.fillText(`PLAYER ${winnerName} WIN !`, width / 2, height / 2);
        
        ctx.font = "24px system-ui, sans-serif";
        ctx.fillStyle = "#cbd5e1";
        ctx.fillText("Memuat Ulang...", width / 2, height / 2 + 50);
        ctx.shadowBlur = 0;
    }
}

const DT = 1000 / 60;
let acc = 0, last = performance.now();
function frame(now) {
    acc += Math.min(now - last, 100); last = now;
    while (acc >= DT) { step(); acc -= DT; }
    draw();
    requestAnimationFrame(frame);
}

// ==========================================================
//  INPUT & INIT
// ==========================================================
const bindCodes = new Set();
for (const c of chars) Object.values(c.binds).forEach(k => bindCodes.add(k));

function setKey(code, down) {
    for (const c of chars)
        for (const action of ['left', 'right', 'jump', 'punch'])
            if (c.binds[action] === code) c.input[action] = down;
}
window.addEventListener('keydown', e => {
    if (bindCodes.has(e.code)) { setKey(e.code, true); e.preventDefault(); }
});
window.addEventListener('keyup', e => {
    if (bindCodes.has(e.code)) { setKey(e.code, false); e.preventDefault(); }
});
window.addEventListener('blur', () => { for (const c of chars) c.input = { left: false, right: false, jump: false, punch: false }; });

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    groundY = height - FLOOR_HEIGHT;
}
window.addEventListener('resize', () => { resize(); generateRandomPlatforms(); resetChars(); });

// ==BOOT==
resize();
randomizeColors();
generateRandomPlatforms();
resetChars();
requestAnimationFrame(frame);
</script>
</body>
