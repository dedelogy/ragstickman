<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Ragdoll Stickman - Controllable V1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scrolling */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        #gameCanvas {
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #38bdf8; /* Sky 400 */
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            color: #94a3b8; /* Slate 400 */
        }

        .controls-hint {
            margin-top: 8px;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <h1>Active Ragdoll Engine V1 (Upgraded)</h1>
        <p class="controls-hint">🎮 KONTROL: Arrow Left / Right = Jalan | Arrow Up = Lompat</p>
        <p>🖱️ Drag stickman dengan mouse untuk tes reaksi fisika ragdoll.</p>
        <p id="ragdoll-info">Ragdoll Factor: 50% (Active Balance Enabled)</p>
    </div>

    <!-- Main Canvas -->
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ==========================================
        // GAME CONFIGURATION & RAGDOLL TWEAKS
        // ==========================================
        const GRAVITY = 0.55;
        const FRICTION = 0.98; // Air resistance
        const BOUNCE = 0.2; // Bounce factor
        
        // --- VARIABLE SETTING RAGDOLL ---
        // 1.0 = 100% Floppy/Letoy (Fisika Ragdoll Pasif)
        // 0.5 = 50% Reduksi Letoy (Active Ragdoll - Seimbang & Kokoh)
        // 0.0 = Fully Rigid (Kaku seperti kayu)
        const RAGDOLL_PERCENTAGE = 0.5; 

        // Iterasi kalkulasi constraint (Makin tinggi = makin kaku/stabil)
        const CONSTRAINT_ITERATIONS = Math.round(8 + (1 - RAGDOLL_PERCENTAGE) * 10);

        let width, height;
        
        // Physics Objects
        let points = [];
        let constraints = [];
        let platforms = [];

        // Player Controls State
        const keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false };

        // Interaction
        let mouse = { x: 0, y: 0, isDown: false };
        let draggedPoint = null;

        // Animation Cycle for Walking
        let stepPhase = 0;

        // References for Active Posture Control
        let head, neck, chest, pelvis;
        let shoulderL, elbowL, handL, shoulderR, elbowR, handR;
        let hipL, kneeL, footL, hipR, kneeR, footR;

        // Keyboard Event Listeners
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.code)) {
                keys[e.code] = true;
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.code)) {
                keys[e.code] = false;
                e.preventDefault();
            }
        });

        // Resize canvas to fill screen
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initLevel();
        }
        window.addEventListener('resize', resize);

        class Point {
            constructor(x, y, radius = 5, isStatic = false) {
                this.x = x;
                this.y = y;
                this.oldX = x;
                this.oldY = y;
                this.radius = radius;
                this.isStatic = isStatic;
            }

            update() {
                if (this.isStatic) return;

                // Verlet Integration
                let vx = (this.x - this.oldX) * FRICTION;
                let vy = (this.y - this.oldY) * FRICTION;

                this.oldX = this.x;
                this.oldY = this.y;

                this.x += vx;
                this.y += vy + GRAVITY;
            }

            constrainBounds() {
                if (this.isStatic) return;

                // Floor collision
                if (this.y > height - this.radius) {
                    this.y = height - this.radius;
                    let vx = (this.x - this.oldX) * 0.7; // Ground Friction
                    this.oldY = this.y + (this.y - this.oldY) * BOUNCE;
                    this.oldX = this.x - vx;
                }
                
                // Walls
                if (this.x > width - this.radius) {
                    this.x = width - this.radius;
                    this.oldX = this.x + (this.x - this.oldX) * BOUNCE;
                } else if (this.x < this.radius) {
                    this.x = this.radius;
                    this.oldX = this.x + (this.x - this.oldX) * BOUNCE;
                }
            }
        }

        class Constraint {
            constructor(p1, p2, stiffness = 1) {
                this.p1 = p1;
                this.p2 = p2;
                // Modifikasi stiffness berdasarkan RAGDOLL_PERCENTAGE
                this.stiffness = Math.min(1, stiffness * (1 + (1 - RAGDOLL_PERCENTAGE) * 0.5));
                
                const dx = p1.x - p2.x;
                const dy = p1.y - p2.y;
                this.length = Math.sqrt(dx * dx + dy * dy);
            }

            resolve() {
                const dx = this.p2.x - this.p1.x;
                const dy = this.p2.y - this.p1.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance === 0) return;

                const difference = this.length - distance;
                const percent = (difference / distance) / 2 * this.stiffness;
                
                const offsetX = dx * percent;
                const offsetY = dy * percent;

                if (!this.p1.isStatic) {
                    this.p1.x -= offsetX;
                    this.p1.y -= offsetY;
                }
                if (!this.p2.isStatic) {
                    this.p2.x += offsetX;
                    this.p2.y += offsetY;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.p1.x, this.p1.y);
                ctx.lineTo(this.p2.x, this.p2.y);
                ctx.strokeStyle = '#38bdf8'; // Sky 400
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        }

        class Platform {
            constructor(x, y, w, h) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
            }

            collide(point) {
                if (point.isStatic) return;

                if (point.x + point.radius > this.x && 
                    point.x - point.radius < this.x + this.w && 
                    point.y + point.radius > this.y && 
                    point.y - point.radius < this.y + this.h) {
                    
                    let fromTop = (point.y + point.radius) - this.y;
                    
                    if (fromTop > 0 && point.oldY <= this.y + 10) {
                        point.y = this.y - point.radius;
                        let vx = (point.x - point.oldX) * 0.6; // High friction
                        point.oldY = point.y; 
                        point.oldX = point.x - vx;
                    }
                }
            }

            draw() {
                ctx.fillStyle = '#334155'; // Slate 700
                ctx.fillRect(this.x, this.y, this.w, this.h);
                
                ctx.fillStyle = '#475569';
                ctx.fillRect(this.x, this.y, this.w, 5);
            }
        }

        function createRagdoll(x, y) {
            points = [];
            constraints = [];

            // Anatomical Points
            head = new Point(x, y - 60, 15);        // 0
            neck = new Point(x, y - 30, 5);         // 1
            chest = new Point(x, y - 10, 5);        // 2
            pelvis = new Point(x, y + 20, 5);       // 3
            
            shoulderL = new Point(x - 20, y - 30, 5); // 4
            elbowL = new Point(x - 30, y, 5);       // 5
            handL = new Point(x - 35, y + 30, 5);   // 6
            
            shoulderR = new Point(x + 20, y - 30, 5); // 7
            elbowR = new Point(x + 30, y, 5);       // 8
            handR = new Point(x + 35, y + 30, 5);   // 9
            
            hipL = new Point(x - 15, y + 20, 5);    // 10
            kneeL = new Point(x - 15, y + 60, 5);   // 11
            footL = new Point(x - 15, y + 100, 5);  // 12
            
            hipR = new Point(x + 15, y + 20, 5);    // 13
            kneeR = new Point(x + 15, y + 60, 5);   // 14
            footR = new Point(x + 15, y + 100, 5);  // 15

            points.push(head, neck, chest, pelvis, shoulderL, elbowL, handL, shoulderR, elbowR, handR, hipL, kneeL, footL, hipR, kneeR, footR);

            const addBone = (p1, p2, stiffness = 1) => {
                constraints.push(new Constraint(p1, p2, stiffness));
            };

            // Spine
            addBone(head, neck, 1.0);
            addBone(neck, chest, 1.0);
            addBone(chest, pelvis, 1.0);

            // Arms
            addBone(neck, shoulderL, 0.9);
            addBone(shoulderL, elbowL, 0.8);
            addBone(elbowL, handL, 0.8);
            
            addBone(neck, shoulderR, 0.9);
            addBone(shoulderR, elbowR, 0.8);
            addBone(elbowR, handR, 0.8);

            // Legs
            addBone(pelvis, hipL, 1.0);
            addBone(hipL, kneeL, 0.9);
            addBone(kneeL, footL, 0.9);
            
            addBone(pelvis, hipR, 1.0);
            addBone(hipR, kneeR, 0.9);
            addBone(kneeR, footR, 0.9);

            // Structural Constraints (Kekakuan Postur Tubuh)
            addBone(shoulderL, shoulderR, 0.9);
            addBone(hipL, hipR, 0.9);
            
            // Penguat Tulang Belakang & Dada (Mencegah patah pinggang berlebihan)
            addBone(head, chest, 0.8);
            addBone(neck, pelvis, 0.8);
            addBone(shoulderL, pelvis, 0.7);
            addBone(shoulderR, pelvis, 0.7);

            // Penguat Kaki (Penopang Berat Badan)
            addBone(hipL, footL, 0.6); // Menjaga rentang kaki
            addBone(hipR, footR, 0.6);
        }

        // ==========================================
        // LOGIKA ACTIVE POSTURE & KONTROL GERAK
        // ==========================================
        function isGrounded() {
            // Cek apakah kaki menyentuh lantai utama
            if (footL.y >= height - footL.radius - 2 || footR.y >= height - footR.radius - 2) {
                return true;
            }
            // Cek apakah kaki menyentuh platform
            for (let plat of platforms) {
                if (footL.x >= plat.x && footL.x <= plat.x + plat.w && Math.abs(footL.y - plat.y) < 10) return true;
                if (footR.x >= plat.x && footR.x <= plat.x + plat.w && Math.abs(footR.y - plat.y) < 10) return true;
            }
            return false;
        }

        function applyActivePostureAndControl() {
            if (draggedPoint) return; // Jika sedang ditarik mouse, matikan penyeimbang otomatis

            // Kekuatan Postur Aktif (Makin rendah RAGDOLL_PERCENTAGE, makin kuat gaya penyeimbangnya)
            const posturePower = (1 - RAGDOLL_PERCENTAGE * 0.5); 
            const grounded = isGrounded();

            // 1. PENYEIMBANG POSTUR BERDIRI (Tegak Lurus)
            if (grounded) {
                const avgFeetX = (footL.x + footR.x) / 2;
                
                // Tarik Kepala & Dada agar selalu berada tepat di atas titik tumpu kaki
                head.x += (avgFeetX - head.x) * 0.12 * posturePower;
                chest.x += (avgFeetX - chest.x) * 0.1 * posturePower;
                pelvis.x += (avgFeetX - pelvis.x) * 0.05 * posturePower;

                // Dorong Kepala & Leher ke Atas (Anti-Gravity Posture)
                const targetHeadY = pelvis.y - 80;
                if (head.y > targetHeadY) {
                    head.y -= (head.y - targetHeadY) * 0.15 * posturePower;
                    neck.y -= (neck.y - (pelvis.y - 50)) * 0.1 * posturePower;
                }

                // Penguat Lutut agar tidak melipat habis saat menopang badan
                const idealKneeLY = (hipL.y + footL.y) / 2;
                const idealKneeRY = (hipR.y + footR.y) / 2;
                kneeL.y += (idealKneeLY - kneeL.y) * 0.2 * posturePower;
                kneeR.y += (idealKneeRY - kneeR.y) * 0.2 * posturePower;
            }

            // 2. KONTROL BERJALAN / LARI (ARROW LEFT / RIGHT)
            const moveSpeed = 1.8;
            let isMoving = false;

            if (keys.ArrowRight) {
                isMoving = true;
                // Dorong pinggul dan dada ke kanan
                pelvis.x += moveSpeed;
                chest.x += moveSpeed * 0.8;
                head.x += moveSpeed * 0.7;

                // Animasi Langkah Kaki Datar (Procedural Step)
                stepPhase += 0.2;
                footL.x += Math.cos(stepPhase) * 4;
                footL.y -= Math.sin(stepPhase) * 2;
                footR.x += Math.cos(stepPhase + Math.PI) * 4;
                footR.y -= Math.sin(stepPhase + Math.PI) * 2;
            }

            if (keys.ArrowLeft) {
                isMoving = true;
                // Dorong pinggul dan dada ke kiri
                pelvis.x -= moveSpeed;
                chest.x -= moveSpeed * 0.8;
                head.x -= moveSpeed * 0.7;

                // Animasi Langkah Kaki
                stepPhase += 0.2;
                footL.x -= Math.cos(stepPhase) * 4;
                footL.y -= Math.sin(stepPhase) * 2;
                footR.x -= Math.cos(stepPhase + Math.PI) * 4;
                footR.y -= Math.sin(stepPhase + Math.PI) * 2;
            }

            // 3. KONTROL LOMPAT (ARROW UP)
            if (keys.ArrowUp && grounded) {
                const jumpForce = 13;
                
                // Berikan Impuls Kecepatan Vertikal ke Seluruh Tubuh Utama
                pelvis.oldY = pelvis.y + jumpForce;
                chest.oldY = chest.y + jumpForce;
                head.oldY = head.y + jumpForce;
                footL.oldY = footL.y + jumpForce * 0.8;
                footR.oldY = footR.y + jumpForce * 0.8;

                // Angkat lutut sedikit saat melompat
                kneeL.y -= 5;
                kneeR.y -= 5;
            }

            // Pose Tangan Natural saat Diam vs Bergerak
            if (!isMoving && grounded) {
                // Tangan rileks di samping badan
                handL.x += ((shoulderL.x - 10) - handL.x) * 0.1;
                handR.x += ((shoulderR.x + 10) - handR.x) * 0.1;
            } else if (isMoving) {
                // Ayunan Tangan saat Berlari
                handL.x += Math.sin(stepPhase + Math.PI) * 3;
                handR.x += Math.sin(stepPhase) * 3;
            }
        }

        function drawHelmet(headPoint, neckPoint) {
            const dx = headPoint.x - neckPoint.x;
            const dy = headPoint.y - neckPoint.y;
            let angle = Math.atan2(dy, dx) + Math.PI / 2;

            ctx.save();
            ctx.translate(headPoint.x, headPoint.y);
            ctx.rotate(angle);

            // Draw Gladiator Helmet
            ctx.fillStyle = '#fbbf24'; // Amber/Gold
            ctx.strokeStyle = '#b45309'; // Dark gold border
            ctx.lineWidth = 2;

            // Helmet Dome
            ctx.beginPath();
            ctx.arc(0, 0, 16, Math.PI, 0); 
            ctx.fill();
            ctx.stroke();

            // Face guard
            ctx.beginPath();
            ctx.moveTo(-16, 0);
            ctx.lineTo(-12, 18);
            ctx.lineTo(-5, 12);
            ctx.lineTo(5, 12);
            ctx.lineTo(12, 18);
            ctx.lineTo(16, 0);
            ctx.fill();
            ctx.stroke();

            // Plume
            ctx.fillStyle = '#ef4444'; // Red 500
            ctx.beginPath();
            ctx.ellipse(0, -18, 5, 12, Math.PI / 2, 0, Math.PI * 2);
            ctx.fill();

            // Eye slot
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-8, 2, 16, 4);

            ctx.restore();
        }

        function getDistance(p1, p2) {
            return Math.sqrt((p1.x - p2.x)**2 + (p1.y - p2.y)**2);
        }

        // Mouse Handlers
        function handleStart(e) {
            e.preventDefault();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            mouse.x = clientX;
            mouse.y = clientY;
            mouse.isDown = true;

            let closestDist = 50;
            for (let p of points) {
                let dist = getDistance(p, mouse);
                if (dist < closestDist) {
                    closestDist = dist;
                    draggedPoint = p;
                }
            }
        }

        function handleMove(e) {
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            mouse.x = clientX;
            mouse.y = clientY;
        }

        function handleEnd() {
            mouse.isDown = false;
            draggedPoint = null;
        }

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleEnd);

        function initLevel() {
            platforms = [];
            // Area Platform untuk Eksperimen Berjalan dan Melompat
            platforms.push(new Platform(width * 0.1, height * 0.65, 220, 20));
            platforms.push(new Platform(width * 0.65, height * 0.5, 250, 20));
            platforms.push(new Platform(width * 0.38, height * 0.8, 300, 20));
            
            createRagdoll(width / 2, 100);
            
            // UI Info Update
            document.getElementById('ragdoll-info').innerText = 
                `Ragdoll Factor: ${Math.round(RAGDOLL_PERCENTAGE * 100)}% | Stiffness Iterations: ${CONSTRAINT_ITERATIONS}`;
        }

        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            // Handle Dragging
            if (draggedPoint && mouse.isDown) {
                draggedPoint.x = mouse.x;
                draggedPoint.y = mouse.y;
                draggedPoint.oldX = mouse.x;
                draggedPoint.oldY = mouse.y;
            }

            // 1. Terapkan Fisika Posisi
            for (let p of points) {
                p.update();
            }

            // 2. Terapkan Postur Aktif & Input Kontrol Keyboard
            applyActivePostureAndControl();

            // 3. Resolver Batasan Tulang & Tabrakan (Constraint Iterations)
            for (let i = 0; i < CONSTRAINT_ITERATIONS; i++) {
                for (let c of constraints) {
                    c.resolve();
                }
                
                for (let p of points) {
                    p.constrainBounds();
                    for (let plat of platforms) {
                        plat.collide(p);
                    }
                }
            }

            // 4. Render Visuals
            for (let plat of platforms) {
                plat.draw();
            }

            for (let c of constraints) {
                c.draw();
            }

            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                
                if (i === 0) {
                    drawHelmet(p, points[1]); // Head & Neck
                    continue;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = i === 1 ? 'transparent' : '#e0f2fe';
                ctx.fill();
            }

            requestAnimationFrame(gameLoop);
        }

        // Start Engine
        resize();
        gameLoop();

    </script>
</body>
</html>
